spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/provider}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:provider}
    password: ${DB_PASSWORD:provider}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true

  jackson:
    deserialization:
      fail-on-unknown-properties: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.boot.security.autoconfigure: WARN
    org.hibernate.SQL: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger - %msg%n"

third-party:
  free:
    failure-rate: 0.5
  premium:
    failure-rate: 0.1